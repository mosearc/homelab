# wg-easy v15 — WireGuard VPN with web admin UI
# Runs as Docker-in-LXC inside CT 100 (unprivileged, nesting + keyctl enabled).
#
# v15 notes:
#   - Admin account + the public "host" (endpoint baked into client configs)
#     are set in the SETUP WIZARD on first launch, NOT via env vars.
#   - INSECURE=true allows the admin UI over plain HTTP on the LAN only.
#     Do NOT expose port 51821 to the internet.
#   - /lib/modules mount lets the container use the host's in-kernel WireGuard.
#   - Image pinned to major tag 15 (a major bump changes the on-disk format).
#
# Router: forward UDP 51820 -> 10.77.0.100. Never forward 51821.

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    environment:
      INSECURE: "true"
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"   # WireGuard tunnel (port-forwarded on the router)
      - "51821:51821/tcp"   # Admin UI — LAN only
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  etc_wireguard:
